<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>救援机器人 · 实时监看</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#ecf2fa;font-family:system-ui,"Noto Sans CJK SC",sans-serif}header{height:76px;display:flex;align-items:center;gap:22px;padding:12px 24px;border-bottom:1px solid #344152}h1{font-size:23px;margin:0}.pill{padding:7px 14px;border-radius:20px;background:#563e15;color:#ffdc94} .live{background:#143d31;color:#83e5bf}.muted{color:#9cabbf}#clock{margin-left:auto;font-variant-numeric:tabular-nums}button{font:inherit;background:#233044;border:1px solid #455971;color:#edf5ff;border-radius:8px;padding:8px 12px;cursor:pointer}button.active{background:#245675}.cards{display:grid;grid-template-columns:1.3fr 2fr 1fr 1fr;gap:12px;padding:14px 20px}.card{min-width:0;background:#1a2431;border:1px solid #304055;border-radius:10px;padding:12px 16px}.label{font-size:14px;color:#9cabbf;margin-bottom:6px}.value{font-size:24px;font-weight:650;overflow-wrap:anywhere}#reason{font-size:18px}.layout{height:calc(100vh - 197px);min-height:360px;display:grid;grid-template-columns:57% 43%;padding:0 20px 16px;gap:14px}.panel{min-width:0;min-height:0;background:#151e2a;border:1px solid #304055;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #304055}.imagebox{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#080d14}.imagebox img{height:100%;width:100%;object-fit:contain;display:none}#placeholder{position:absolute;text-align:center;color:#a9b7c9;font-size:21px;padding:20px}.info{padding:10px 14px;color:#9cabbf;font-size:14px}#log{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:12px 14px;font:14px/1.55 ui-monospace,"Noto Sans Mono",monospace;color:#cfe2f7}#logname{font-size:12px;overflow-wrap:anywhere}#logage{font-size:13px;white-space:nowrap}.buttons{display:flex;gap:6px}.readonly{font-size:13px;color:#9cabbf}@media(max-width:1000px){.layout{grid-template-columns:52% 48%;padding:0 10px 10px}.cards{padding:10px;gap:8px}.value{font-size:20px}header{padding:10px}#log{font-size:12px}.readonly{display:none}}@media(max-width:700px){.layout{display:flex;flex-direction:column;height:auto}.panel{min-height:340px}.cards{grid-template-columns:1fr 1fr}header{gap:8px}h1{font-size:17px}#clock{display:none}}
</style><header><h1>救援机器人 · 实时监看</h1><span id="health" class="pill">等待主程序</span><span class="readonly">只读画面与日志</span><span id="clock"></span><button id="fullscreen">全屏</button></header>
<section class="cards"><div class="card"><div class="label">当前状态</div><div class="value" id="state">—</div></div><div class="card"><div class="label">动作原因</div><div class="value" id="reason">等待实时数据</div></div><div class="card"><div class="label">比赛剩余 / 已交付</div><div class="value" id="match">—</div></div><div class="card"><div class="label">画面上限 / 控制循环</div><div class="value" id="fps">—</div></div></section>
<main class="layout"><section class="panel"><div class="bar"><strong>相机与目标标注</strong><span id="cameraState" class="muted">等待画面</span></div><div class="imagebox"><img id="camera" alt="实时相机画面"><div id="placeholder">等待比赛程序发布画面<br><small>此窗口不会自行启动摄像头或机器人</small></div></div><div class="info" id="motion">指令速度：—　相机角度：—</div></section>
<section class="panel"><div class="bar"><strong>实时日志</strong><div class="buttons"><button id="events" class="active">状态事件</button><button id="all">全部</button><button id="pause">暂停滚动</button></div></div><div class="bar"><span id="logname" class="muted">尚无比赛日志</span><span id="logage" class="muted"></span></div><pre id="log">等待日志…</pre><div class="info">自动跟随新一趟日志；离线时保留的文字仅为历史记录。</div></section></main>
<script>
const $=id=>document.getElementById(id);let mode='events',paused=false,data=null,stream='',imageFailed=false,retryAt=0;
function logs(){if(paused||!data)return;const l=data.logs||{};$('logname').textContent=l.name||'尚无比赛日志';$('logage').textContent=l.age_s==null?'':`更新于 ${Math.round(l.age_s)} 秒前`;const text=(l[mode]||[]).join('\n')||'等待日志…';if($('log').textContent!==text){$('log').textContent=text;$('log').scrollTop=$('log').scrollHeight;}}
$('events').onclick=()=>{mode='events';$('events').classList.add('active');$('all').classList.remove('active');logs()};$('all').onclick=()=>{mode='lines';$('all').classList.add('active');$('events').classList.remove('active');logs()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续滚动':'暂停滚动';logs()};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};
$('camera').onerror=()=>{imageFailed=true;retryAt=Date.now()+2000;$('camera').style.display='none';$('placeholder').style.display='block';$('placeholder').textContent='画面连接中断，正在重试…'};
$('camera').onload=()=>{imageFailed=false;if(data&&data.camera_live){$('camera').style.display='block';$('placeholder').style.display='none'}};
function offline(){stream='';$('camera').removeAttribute('src');$('camera').style.display='none';$('placeholder').style.display='block';$('placeholder').textContent='等待主程序发布实时画面';$('health').textContent='等待主程序 / 数据离线';$('health').className='pill';for(const id of ['state','reason','match','fps'])$(id).textContent='—';$('motion').textContent='指令速度：—　相机角度：—';$('cameraState').textContent='无实时画面';}
async function poll(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2200);try{const response=await fetch('/api',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error();data=await response.json();logs();if(!data.live){offline();return;}const t=data.telemetry||{},s=t.state||{},h=t.health||{},m=t.motion||{};$('health').textContent='实时数据已连接';$('health').className='pill live';$('state').textContent=s.name||'—';$('reason').textContent=s.reason||'—';$('match').textContent=`${Math.max(0,Math.ceil((s.match_remaining_ms||0)/1000))}s / ${s.delivered_total||0}`;$('fps').textContent=`${Number(h.publish_fps_limit||0).toFixed(0)} / ${Number(h.loop_fps||0).toFixed(1)} fps`;$('motion').textContent=`指令 vx ${m.vx_mps??'—'} m/s　wz ${m.wz_rps??'—'} rad/s　相机 ${s.camera_pitch_cmd_cdeg!=null?(s.camera_pitch_cmd_cdeg/100)+'°':'—'}`;if(data.camera_live){$('cameraState').textContent='实时画面';if(stream!==data.stream_url||(imageFailed&&Date.now()>=retryAt)){stream=data.stream_url;imageFailed=false;$('camera').style.display='block';$('placeholder').style.display='none';$('camera').src=stream+'?t='+Date.now();}}else{stream='';$('camera').removeAttribute('src');$('camera').style.display='none';$('placeholder').style.display='block';$('placeholder').textContent='相机数据已过期，等待新画面';$('cameraState').textContent='相机离线';}}catch(e){offline();$('health').textContent='监看服务连接中断';}finally{clearTimeout(timer);$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});setTimeout(poll,500)}}poll();
</script></html>
